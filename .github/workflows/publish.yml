name: Publish to PyPI

# GitHub-only release (Eduardo, 2026-09-14): this project releases on GitHub
# only -- no PyPI trusted publisher is configured for this repository, and
# none is planned. Dormant by design -- NOTHING here runs on a push, and it
# no longer runs on a published GitHub Release either; the only trigger is a
# manual `workflow_dispatch`, so this job runs only if someone deliberately
# asks it to. It uses PyPI Trusted Publishing, so even a manual run stays
# inert until a trusted publisher is configured on PyPI for this repository +
# workflow (https://docs.pypi.org/trusted-publishers/) -- until then the
# publish step has no credentials and cannot upload.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/keck-ao-performance-estimator
    permissions:
      id-token: write            # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
