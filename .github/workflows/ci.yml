name: CI

# fieldsolve P0-1 (2026-09-12): this used to trigger on `master` only, but
# the estimator's default branch is `main` -- CI had never once run on the
# public repo. Also covers the hotfix/**, fieldsolve/**, docs/** and
# parallel/** branch prefixes this and the follow-on projects push to, so
# their branches get a real CI run before any cherry-pick to main.
# parallel PR-P0-3 (2026-09-13): added parallel/** -- same reasoning as
# fieldsolve/** before it (parallel/p0-fix had no trigger at all until
# this line existed).
on:
  push:
    branches: [main, master, "hotfix/**", "fieldsolve/**", "docs/**",
              "parallel/**"]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      # Headless Qt (offscreen platform plugin) needs a handful of X11/EGL
      # shared libraries present even without a display -- PyQt6 wheels do
      # not bundle these system libs.
      - name: Install headless Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libgl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3
      - run: pip install -e ".[gui,dev]"
      - name: Run test suite (correctness + regression harness + GUI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
